[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aegis-agent-runtime"
version = "0.1.0"
description = "Model-independent autonomous AI agent runtime research platform"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "langgraph>=1.2,<2",
  "langgraph-checkpoint-postgres>=2,<4",
  "temporalio>=1.33,<2",
  "mcp>=2,<3",
  "litellm>=1.60,<2",
  "sqlalchemy[asyncio]>=2.0,<3",
  "asyncpg>=0.30,<1",
  "alembic>=1.14,<2",
  "pgvector>=0.4,<1",
  "redis>=5,<7",
  "httpx>=0.28,<1",
  "tenacity>=9,<10",
  "structlog>=25,<26",
  "opentelemetry-api>=1.30,<2",
  "opentelemetry-sdk>=1.30,<2",
]

[dependency-groups]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<2",
  "pytest-cov>=6,<8",
  "ruff>=0.11,<1",
  "mypy>=1.15,<2",
  "testcontainers[postgres]>=4.9,<5",
]

[tool.hatch.build.targets.wheel]
packages = ["src/aegis"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
